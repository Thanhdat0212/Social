name: Social Backend CI

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/main.yml"
  pull_request:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/main.yml"

jobs:
  build:
    name: Build .NET 8 Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Backend/API/API.csproj

      - name: Build solution
        run: dotnet build Backend/API/API.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Backend/Tests/Tests.csproj --configuration Release
